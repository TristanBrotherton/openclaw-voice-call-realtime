id: oh-spanish
class: outbound_human
description: The restaurant answers in Spanish and continues in Spanish.
direction: outbound
call:
  message: Book a table for two this Friday at 7pm under the name Sam Taylor.
  talking_points: [Table for 2 this Friday at 7pm, Name Sam Taylor]
  call_party: third-party
amd: { verdict: human, at_ms: 2500 }
steps:
  - id: hello
    say: "¿Bueno? Taquería El Sol, ¿en qué le puedo ayudar?"
    gate: { at_ms: 600 }
    voice: nova
    instructions: Native Mexican Spanish speaker, natural pace.
  - id: offer
    say: "Sí, claro. Tenemos mesa para dos el viernes a las siete. ¿A nombre de quién?"
    gate: { after_bot_done: { quiet_ms: 900 } }
    voice: nova
    instructions: Native Mexican Spanish speaker, natural pace.
    expect: { bot_says: "sam|taylor" }
  - id: done
    say: "Perfecto, queda reservado. Hasta el viernes."
    gate: { after_bot_done: { quiet_ms: 900 } }
    gate_timeout_ms: 15000
    voice: nova
    instructions: Native Mexican Spanish speaker, natural pace.
expect:
  ended_by: bot
  tools_called: [end_call]
  heard_any: ["gracias|perfecto|viernes|nombre|por favor|mesa"]
  goodbye_complete: true
  no_plugin_errors: true
limits: { max_duration_ms: 90000 }
