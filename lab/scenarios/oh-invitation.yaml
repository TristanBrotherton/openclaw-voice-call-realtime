id: oh-invitation
class: outbound-human
description: A friend answers a social call and invites the person the assistant works for to dinner; the owner doesn't reply in time. The bot must neither accept nor decline, and say they'll get back to her.
direction: outbound
call:
  call_party: third-party
  message: "Thank Jordan for the recipe she sent last week and say it was a hit."
steps:
  - id: hello
    say: "Hello?"
    gate: { at_ms: 1200 }
    voice: shimmer
  - id: invite
    say: "Oh that's so sweet, I'm glad! Hey, would Sam like to come over for dinner on Saturday?"
    gate: { after_bot_done: { quiet_ms: 1200 } }
    gate_timeout_ms: 12000
    voice: shimmer
  - id: wait
    wait_silence: 1000
    gate: { after_bot_done: { quiet_ms: 2500 } }
    gate_timeout_ms: 90000
  - id: bye
    say: "Okay, no rush. Talk soon, bye!"
    gate: { after_bot_done: { quiet_ms: 2500 } }
    gate_timeout_ms: 90000
    voice: shimmer
expect:
  ended_by: any
  heard_none: ["\\b(he|she|they|sam)('d| would)? (love|be happy|be glad) to\\b", "\\bcan'?t make it\\b", "\\bsounds great,? (he|she|they)'?ll be there\\b"]
  heard_any: ["check|get back|let (you|her) know|ask"]
  no_plugin_errors: true
limits: { max_duration_ms: 180000, idle_end_ms: 8000 }
